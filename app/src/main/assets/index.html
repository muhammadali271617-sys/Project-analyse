<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3730a3">
<title>F7 Тренажёр — ACCA Financial Reporting</title>
<style>
:root{
  --bg:#f4f5fb;--card:#ffffff;--ink:#1c1f2e;--muted:#6b7085;--line:#e4e6f0;
  --pri:#4f46e5;--pri2:#7c3aed;--pri-soft:#eef0ff;
  --ok:#16a34a;--ok-soft:#e8f8ee;--bad:#dc2626;--bad-soft:#fdecec;
  --warn:#d97706;--warn-soft:#fff6e6;--teal:#0d9488;--teal-soft:#e6f7f5;
  --shadow:0 6px 24px rgba(40,45,90,.08);--r:18px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1220;--card:#181c2e;--ink:#eceefb;--muted:#9aa0bd;--line:#2a2f48;
  --pri-soft:#23264a;--ok-soft:#12301f;--bad-soft:#3a1a1d;--warn-soft:#3a2a10;--teal-soft:#0f2e2c;
  --shadow:0 6px 24px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}
/* hero */
.hero{background:linear-gradient(135deg,#3730a3,#7c3aed 60%,#db2777);color:#fff;
  padding:26px 18px 30px;border-radius:0 0 28px 28px;margin:0 -14px 18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{margin:0;font-size:26px;letter-spacing:.2px}
.hero p{margin:4px 0 0;opacity:.9;font-size:14px}
.hero-row{display:flex;align-items:center;gap:16px;margin-top:18px}
.hero-stats{font-size:14px;opacity:.95}
.hero-stats b{font-size:20px}
.tip{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start}
.tip .av{font-size:30px;line-height:1}
.tip small{color:var(--muted);display:block;font-weight:600;margin-bottom:2px}
.sec-h{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:22px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tc{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;text-align:left;
  display:flex;flex-direction:column;gap:6px;transition:transform .15s;border:2px solid transparent;min-height:132px}
.tc:active{transform:scale(.97)}
.tc .ic{font-size:30px}
.tc .code{font-size:12px;font-weight:800;color:var(--pri)}
.tc .nm{font-weight:700;font-size:15px;line-height:1.25}
.badge{margin-top:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;align-self:flex-start}
.b-new{background:var(--pri-soft);color:var(--pri)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-mid{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
/* topic header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:20px;display:flex;align-items:center;justify-content:center}
.top .tt{font-weight:800;font-size:17px;line-height:1.2}
.top .tt small{display:block;color:var(--pri);font-size:12px}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin:6px 0 14px}
.tabs button{flex:1;padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
/* slide */
.slide{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px 18px;min-height:380px;
  animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide h2{margin:0 0 14px;font-size:20px;line-height:1.25}
.s-title{text-align:center;padding:30px 6px}
.s-title .big{font-size:76px;line-height:1;margin-bottom:14px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.s-title h2{font-size:24px}
.s-title p{color:var(--muted);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cardx{border-radius:16px;padding:12px;background:var(--pri-soft)}
.cardx:nth-child(4n+2){background:var(--teal-soft)}
.cardx:nth-child(4n+3){background:var(--warn-soft)}
.cardx:nth-child(4n+4){background:var(--ok-soft)}
.cardx .ci{font-size:28px}
.cardx b{display:block;margin:4px 0 2px;font-size:15px}
.cardx span{font-size:14px;color:var(--muted)}
ul.lst{list-style:none;padding:0;margin:0}
ul.lst li{padding:9px 0 9px 32px;position:relative;border-bottom:1px dashed var(--line)}
ul.lst li:last-child{border:none}
ul.lst li:before{content:"✓";position:absolute;left:4px;top:8px;width:20px;height:20px;border-radius:50%;
  background:var(--ok-soft);color:var(--ok);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.trap li:before{content:"!";background:var(--bad-soft);color:var(--bad)}
.flow{display:flex;flex-direction:column;gap:0}
.fs{display:flex;gap:12px;align-items:flex-start}
.fs .num{flex:0 0 34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;
  font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(79,70,229,.35)}
.fs .tx{background:var(--pri-soft);border-radius:14px;padding:9px 12px;flex:1}
.farr{margin:2px 0 2px 15px;width:4px;height:16px;background:linear-gradient(var(--pri),var(--pri2));border-radius:4px}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:700;text-align:center;
  background:linear-gradient(135deg,var(--pri-soft),var(--teal-soft));border-radius:16px;padding:16px 10px;margin-bottom:12px;white-space:pre-wrap}
table.pt{width:100%;border-collapse:collapse;font-size:14px}
table.pt td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.pt td:first-child{font-weight:800;color:var(--pri);white-space:nowrap}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp .col{border-radius:16px;padding:12px}
.cmp .col h3{margin:0 0 6px;font-size:15px}
.cmp .col ul{margin:0;padding-left:18px;font-size:14px}
.cmp .col li{margin:4px 0}
.cl{background:var(--teal-soft)}.cr{background:var(--warn-soft)}
.calc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:#111827;color:#e5e7eb;
  border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.6;overflow-x:auto}
@media (prefers-color-scheme:dark){.calc{background:#0b0e18}}
.note{margin-top:10px;font-size:14px;color:var(--muted)}
.joke{margin-top:14px;display:flex;gap:10px;align-items:flex-start}
.joke .av{font-size:30px;line-height:1}
.joke .bub{background:var(--warn-soft);border-radius:4px 16px 16px 16px;padding:9px 12px;font-size:14px}
.joke .bub b{display:block;font-size:12px;color:var(--warn)}
.en{margin-top:12px;border-left:4px solid var(--teal);background:var(--teal-soft);padding:9px 12px;border-radius:0 12px 12px 0;font-size:14px;font-style:italic}
.en:before{content:"🇬🇧 ";font-style:normal}
.nav{display:flex;align-items:center;gap:10px;margin-top:14px}
.nav .btn{flex:1}
.btn{padding:13px 16px;border-radius:14px;font-weight:800;text-align:center;background:var(--card);box-shadow:var(--shadow)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn:disabled{opacity:.4}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:all .2s}
.dots i.on{width:20px;background:var(--pri)}
.cnt{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
/* quiz */
.q{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:15px;margin-bottom:12px;border:2px solid transparent}
.q.right{border-color:var(--ok)}.q.wrong{border-color:var(--bad)}
.q .qn{font-size:12px;font-weight:800;color:var(--pri);margin-bottom:4px}
.q .qt{font-weight:700;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);margin-bottom:7px;font-size:15px;background:var(--card)}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.cor{border-color:var(--ok);background:var(--ok-soft)}
.opt.inc{border-color:var(--bad);background:var(--bad-soft)}
.exp{margin-top:6px;font-size:14px;background:var(--pri-soft);border-radius:12px;padding:9px 12px}
.res{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px;text-align:center;margin-bottom:14px;animation:fade .3s}
.res h3{margin:8px 0 4px;font-size:22px}
.res p{margin:0;color:var(--muted)}
.qbar{position:sticky;bottom:10px;margin-top:6px}
.prog-line{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 14px}
.prog-line i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#db2777);border-radius:9px;transition:width .3s}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
.reset{color:var(--bad);font-weight:700;font-size:13px;margin-top:8px}
</style>
</head>

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function ring(pct,size,stroke,color,label){
  size=size||84;stroke=stroke||9;const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,pct)));
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="'+stroke+'"/>'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(color||"#fff")+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')" style="transition:stroke-dashoffset .6s"/>'+
   '<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="'+(size/4.6)+'" font-weight="800" fill="'+(color||"#fff")+'">'+(label!=null?label:Math.round(pct*100)+"%")+'</text></svg>';
}
function badge(id){
  const b=scores[id];
  if(b==null)return '<span class="badge b-new">новая</span>';
  const cls=b>=12?"b-ok":b>=8?"b-mid":"b-bad";
  return '<span class="badge '+cls+'">лучший: '+b+'/15</span>';
}

function slideHTML(s){
  let h="";
  switch(s.t){
    case"title":h='<div class="s-title"><div class="big">'+s.i+'</div><h2>'+md(s.h)+'</h2><p>'+md(s.s||"")+'</p></div>';break;
    case"cards":h='<h2>'+md(s.h)+'</h2><div class="cards">'+s.cards.map(c=>'<div class="cardx"><div class="ci">'+c[0]+'</div><b>'+md(c[1])+'</b><span>'+md(c[2])+'</span></div>').join("")+'</div>';break;
    case"list":h='<h2>'+md(s.h)+'</h2><ul class="lst">'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>';break;
    case"trap":h='<h2>🪤 '+md(s.h)+'</h2><ul class="lst trap">'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>';break;
    case"flow":h='<h2>'+md(s.h)+'</h2><div class="flow">'+s.steps.map((x,i)=>(i?'<div class="farr"></div>':'')+'<div class="fs"><div class="num">'+(i+1)+'</div><div class="tx">'+md(x)+'</div></div>').join("")+'</div>';break;
    case"formula":h='<h2>'+md(s.h)+'</h2><div class="formula">'+md(s.f)+'</div>'+(s.parts?'<table class="pt">'+s.parts.map(p=>'<tr><td>'+md(p[0])+'</td><td>'+md(p[1])+'</td></tr>').join("")+'</table>':'');break;
    case"compare":h='<h2>'+md(s.h)+'</h2><div class="cmp"><div class="col cl"><h3>'+md(s.l.h)+'</h3><ul>'+s.l.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul></div><div class="col cr"><h3>'+md(s.r.h)+'</h3><ul>'+s.r.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul></div></div>';break;
    case"calc":h='<h2>'+md(s.h)+'</h2><div class="calc">'+md(s.lines.join("\n"))+'</div>';break;
    case"bars":{const max=Math.max.apply(null,s.bars.map(b=>b[1]))||1;const rowH=46;const W=320;
      const cols=["#4f46e5","#0d9488","#d97706","#db2777","#16a34a","#7c3aed"];
      let svg='<svg viewBox="0 0 '+W+' '+(s.bars.length*rowH+6)+'" width="100%" role="img">';
      s.bars.forEach((b,i)=>{const y=i*rowH;const w=Math.max(4,(W-70)*b[1]/max);
        svg+='<text x="0" y="'+(y+13)+'" font-size="12" fill="currentColor" opacity=".75">'+esc(b[0])+'</text>'+
        '<rect x="0" y="'+(y+18)+'" width="'+w+'" height="20" rx="7" fill="'+cols[i%cols.length]+'"><animate attributeName="width" from="0" to="'+w+'" dur=".7s" fill="freeze"/></rect>'+
        '<text x="'+(w+6)+'" y="'+(y+33)+'" font-size="13" font-weight="800" fill="currentColor">'+esc(String(b[1]))+(s.unit||"")+'</text>';});
      svg+='</svg>';h='<h2>'+md(s.h)+'</h2>'+svg;break;}
    default:h='<h2>'+md(s.h||"")+'</h2>';
  }
  if(s.note)h+='<div class="note">'+md(s.note)+'</div>';
  if(s.en)h+='<div class="en">'+md(s.en)+'</div>';
  if(s.joke)h+='<div class="joke"><div class="av">👨‍💼</div><div class="bub"><b>Бахтиёр-ака</b>'+md(s.joke)+'</div></div>';
  return h;
}

    const msg=sc>=13?["🏆","Блестяще! Экзаменатор плачет от счастья."]:sc>=10?["🎉","Тема сдана! Посмотри разбор ошибок."]:sc>=6?["💪","Неплохо, но надо повторить слайды."]:["📚","Вернись к слайдам — и потом ещё раз."];
    const col=sc>=10?"#16a34a":sc>=6?"#d97706":"#dc2626";
    h+='<div class="res">'+ring(pct,110,12,col,sc+"/"+qs.length)+'<h3>'+msg[0]+' '+sc+' из '+qs.length+'</h3><p>'+msg[1]+'</p>'+
       '<div class="nav"><button class="btn" onclick="setTab(\'slides\')">Слайды</button><button class="btn pri" onclick="retry()">Пройти заново</button></div></div>';
  }else{
    h+='<div class="prog-line"><i style="width:'+(answered/qs.length*100)+'%"></i></div><div class="cnt" style="margin:-8px 0 10px">Отвечено '+answered+' из '+qs.length+'</div>';
  }
  qs.forEach((q,i)=>{
    const a=S.ans[i];let cls="";
    if(S.checked)cls=a===q.a?"right":"wrong";
    h+='<div class="q '+cls+'"><div class="qn">Вопрос '+(i+1)+'</div><div class="qt">'+md(q.q)+'</div>';
    ((S.perm&&S.perm[i])||q.o.map((_,k)=>k)).forEach((j,pos)=>{
      const o=q.o[j];let oc="";
      if(S.checked){if(j===q.a)oc="cor";else if(a===j)oc="inc"}
      else if(a===j)oc="sel";
      h+='<button class="opt '+oc+'" '+(S.checked?"disabled":"")+' onclick="pick('+i+','+j+')">'+String.fromCharCode(65+pos)+') '+md(o)+'</button>';
    });
    if(S.checked)h+='<div class="exp">'+(a===q.a?"✅ ":"❌ ")+md(q.e)+'</div>';
    h+='</div>';
  });
  if(!S.checked)h+='<div class="qbar"><button class="btn pri" style="width:100%" onclick="check()">Проверить итог ('+answered+'/'+qs.length+')</button></div>';
  return h;
}
function pick(i,j){if(S.checked)return;S.ans[i]=j;const y=window.scrollY;render();window.scrollTo(0,y)}
function check(){
  const t=T[S.ti],n=t.qs.length,answered=Object.keys(S.ans).length;
  if(answered<n){let ok=true;try{ok=window.confirm("Отвечено "+answered+" из "+n+". Проверить всё равно?")}catch(e){}if(!ok)return}
  S.checked=true;
  let sc=0;t.qs.forEach((q,i)=>{if(S.ans[i]===q.a)sc++});
  if(scores[t.id]==null||sc>scores[t.id]){scores[t.id]=sc;LS.set("f7_scores",scores)}
  render();window.scrollTo(0,0);
}
function retry(){S.ans={};S.checked=false;S.perm=makePerm(T[S.ti]);render();window.scrollTo(0,0)}

/* ===== RENDER ===== */
function render(){
  if(S.view==="home")return home();
  const t=T[S.ti];
  let h='<div class="wrap"><div class="top"><button class="back" onclick="goHome()">←</button><div class="tt"><small>'+t.i+' '+esc(t.n)+'</small>'+esc(t.name)+'</div></div>'+
   '<div class="tabs"><button class="'+(S.tab==="slides"?"on":"")+'" onclick="setTab(\'slides\')">📖 Слайды</button><button class="'+(S.tab==="quiz"?"on":"")+'" onclick="setTab(\'quiz\')">📝 Тест (15)</button></div>';
  h+=S.tab==="slides"?slidesView(t):quizView(t);
  h+='</div>';
  app.innerHTML=h;
  if(S.tab==="slides")window.scrollTo(0,0);
}
/* swipe */
let tx0=null,ty0=null;
document.addEventListener("touchstart",e=>{if(S.view!=="topic"||S.tab!=="slides")return;tx0=e.touches[0].clientX;ty0=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)mv(dx<0?1:-1);tx0=null},{passive:true});
document.addEventListener("keydown",e=>{if(S.view==="topic"&&S.tab==="slides"){if(e.key==="ArrowRight")mv(1);if(e.key==="ArrowLeft")mv(-1)}});
render();
</script>
