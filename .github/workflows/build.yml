name: Build F7 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use F7_Trenazher.html from repo root (if uploaded)
        run: |
          if [ -f F7_Trenazher.html ]; then
            cp F7_Trenazher.html app/src/main/assets/index.html
            echo "Copied F7_Trenazher.html -> app/src/main/assets/index.html"
          fi

      - name: Build debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VERSION="1.0.${{ github.run_number }}"
          NAME="F7-Trenazher-v${VERSION}.apk"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/${NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "path=out/${NAME}" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: F7-Trenazher-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: F7 Тренажёр v${{ steps.apk.outputs.version }}
          body: |
            Скачайте файл APK ниже и установите его на телефон.
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
